{% extends "base.html" %}
{% block title %}Forgot Password — LingoLeap{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-violet-50 via-white to-pink-50 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-violet-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-violet-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-gray-900">Forgot your password?</h1>
      <p class="text-gray-500 mt-2">Enter your email and we'll send you a reset link.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form action="{{ url_for('forgot_password') }}" method="post" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="email">
            Email address
          </label>
          <input type="email" id="email" name="email" required
                 placeholder="your@email.com"
                 autofocus
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400">
        </div>

        <button type="submit"
                class="w-full bg-violet-600 hover:bg-violet-700 text-white font-extrabold py-3 rounded-xl transition-colors shadow-lg">
          Send reset link
        </button>
      </form>

      <div class="mt-5 text-center text-sm text-gray-500">
        Remembered it?
        <a href="{{ url_for('login') }}" class="text-violet-600 font-semibold hover:text-violet-800 transition-colors">
          Back to log in
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
