{% extends "base.html" %}
{% block title %}Reset Password — LingoLeap{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-violet-50 via-white to-pink-50 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-gray-900">Choose a new password</h1>
      <p class="text-gray-500 mt-2">Make it at least 6 characters long.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form action="{{ url_for('reset_password', token=token) }}" method="post" class="space-y-5">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="password">
            New password
          </label>
          <input type="password" id="password" name="password" required minlength="6"
                 placeholder="At least 6 characters"
                 autofocus
                 autocomplete="new-password"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="confirm_password">
            Confirm new password
          </label>
          <input type="password" id="confirm_password" name="confirm_password" required
                 placeholder="Repeat your new password"
                 autocomplete="new-password"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400">
        </div>

        <button type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3 rounded-xl transition-colors shadow-lg">
          Set new password
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
